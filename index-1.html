<style>
:root{--red:#800000;--deep:#4A0404;--gold:#D4AF37;--gl:#FFD700;--ink:#121212;--ivory:#FDFBF7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:72px;height:100%}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#4A0404 0,#121212 60%) fixed;color:var(--ivory);font:16px/1.7 'Manjari','Inter',sans-serif}

h1,h2,h3{font-family:'Cinzel','Manjari',serif;margin:0;line-height:1.25}
.en h1,.en h2,.en h3{font-family:'Cinzel',serif}
.gold{color:var(--gold)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(18,18,18,.75);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,175,55,.3)}

.links{display:flex;gap:6px;align-items:center}
.links a{color:var(--ivory);text-decoration:none;padding:6px 12px;border-radius:99px;font-size:14px;transition:.3s}
.links a:hover,.links a.on{background:rgba(212,175,55,.18);color:var(--gl);box-shadow:0 0 14px rgba(255,215,0,.3)}
.btn{background:linear-gradient(135deg,var(--gold),#a8841f);color:#2a0000;border:0;padding:8px 16px;border-radius:99px;font:700 14px 'Inter',sans-serif;cursor:pointer;text-decoration:none;display:inline-block;transition:.3s}
.btn:hover{box-shadow:0 0 22px rgba(255,215,0,.6);transform:translateY(-2px)}
.burger{display:none;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:4px 10px;font-size:20px}
@media(max-width:820px){.burger{display:block}.links{position:fixed;inset:0 0 0 auto;width:min(80vw,300px);flex-direction:column;align-items:stretch;padding:80px 20px;background:#1a0505;transform:translateX(100%);transition:.35s;border-left:1px solid var(--gold)}.links.open{transform:none}.links a{font-size:18px}}
section{max-width:1080px;margin:0 auto;padding:80px 20px}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.hero:before{content:"";position:absolute;width:520px;height:520px;max-width:90vw;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.22),transparent 65%);z-index:-1;animation:pulse 5s ease-in-out infinite}

.hero h1{font-size:clamp(30px,6vw,64px);background:linear-gradient(90deg,var(--gold),var(--gl),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0}
.hero h2{font-size:clamp(18px,3vw,28px);font-weight:500;color:var(--ivory)}

.deity h3{font-size:18px;padding:0 12px;color:var(--ivory)}.deity small{color:var(--gold);display:block;margin-top:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}

.mb p{white-space:pre-line}.verse{white-space:pre-line;border-left:4px solid var(--gold);background:#f6edd0;padding:12px 18px;margin:16px 0;font-style:italic}
.src{font-size:14px;opacity:.75}
.x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:28px;color:var(--red);cursor:pointer}
.mb .btn{margin-top:14px;background:linear-gradient(135deg,var(--red),var(--deep));color:var(--gl)}
.appeal{padding:44px 28px;text-align:center;border-radius:20px;background:linear-gradient(160deg,rgba(128,0,0,.55),rgba(18,18,18,.8));border:1px solid var(--gold)}
.appeal p{max-width:700px;margin:16px auto}
.cta{margin-top:24px;display:inline-block;padding:20px 32px;border:2px dashed var(--gl);border-radius:16px;background:rgba(0,0,0,.35)}
.cta a{font:700 26px 'Cinzel',serif;color:var(--gl);text-decoration:none}
footer{text-align:center;padding:30px 20px 50px;color:var(--gold);opacity:.8;font-size:14px}
.rv{opacity:0;transform:translateY(28px);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>

  b:['പാതാളമൂർത്തി എന്നുകൂടി വിളിപ്പേരുള്ള ഈ മഹാകാളി ചണ്ഡമുണ്ഡന്മാർ ഒളിച്ചു പാതാളത്തോളം പിന്തുടർന്ന കൊടിയ ഭൈരവിയാണ്. ആലന്തട്ട വനത്തിൽ നായാട്ടിനിറങ്ങിയ വണ്ണാടിൽ പൊതുവാളുടെ പിന്നാലെ കൊടുങ്കാറ്റുപോലെ മടയിൽ നിന്നും പാഞ്ഞോടി വന്ന ദേവി മടയിൽച്ചാമുണ്ഡിയായി ആദ്യാ ആരൂഢമായ ആലന്തട്ട മടവാത്തിലും പിന്നെ തിമിരിഗോപുരത്തിലും കരിവെള്ളൂർ കോട്ടൂരിൽ പയ്യന്നൂർ വണ്ണാടി മീനക്കൊട്ടിലും ശേഷിപ്പെട്ടു. അവിടെ നിന്നാണ് അമ്മോൺപെരുമാളുടെ അനുവാദത്തോടെ അനേകം കാവുകളിലേക്ക് എഴുന്നള്ളിയത്.\n\nമടയിൽച്ചാമുണ്ഡി മറ്റു പേരുകളിട്ടും കെട്ടിയാടിച്ചു വരുന്നുണ്ട്. ആനമടച്ചാമുണ്ഡി, ബലിച്ചേരിചാമുണ്ഡി, മേനച്ചൂർചാമുണ്ഡി, കരിമണൽ ചാമുണ്ഡി, മാമലച്ചാമുണ്ഡി തുടങ്ങിയ പേരുകളാണ് അവ. തെയ്യത്തോറ്റങ്ങളിൽ അതീവ ഹൃദ്യതരമാണ് മടയിൽച്ചാമുണ്ഡിത്തോറ്റം.',

 {n:['വിഷ്ണുമൂർത്തി','Vishnumoorthy'],
  b:['(മലയാളം വിവരണം ഉടൻ — ഇംഗ്ലീഷ് പാഠം താഴെ)\n\nThe story of the Vishnu Moorthy Theyyam is associated with a Thiyya youth who was a cowherd in the village of Koyamburam near Nileshwaram, three centuries ago. Kannan’s job was to graze the cattle of the feudal lord known as Kuruwatt Kurup. Kurup’s niece fell in love with Kannan, and upon learning of this, Kannan ran away to Mangalore. Having spent five years as a priest and daily worshipper of Narasimhamurthi, Kannan returned to Nileshwaram where Kuruwatt Kurup slit his throat at Kadalikkulam. Ominous signs were witnessed throughout the land. As an expiation, Kurup built a kavu for Narasimhamurthi (Vishnu Moorthy) at Kottappuram...',
    'The story of the Vishnu Moorthy Theyyam is associated with a Thiyya youth who was a cowherd in the village of Koyamburam near Nileshwaram, three centuries ago. Kannan’s job was to graze the cattle of the feudal lord known as Kuruwatt Kurup. Kurup’s niece fell in love with Kannan, and upon learning of this, Kannan ran away to Mangalore. Having spent five years as a priest and daily worshipper of Narasimhamurthi, Kannan returned to Nileshwaram where Kuruwatt Kurup slit his throat at Kadalikkulam. Ominous signs were witnessed throughout the land. As an expiation, Kurup built a kavu for Narasimhamurthi (Vishnu Moorthy) at Kottappuram...']},
 {n:['രക്തചാമുണ്ഡി','Raktha Chamundi'],
  b:['രക്തബീജാസുരനെ നിഗ്രഹം ചെയ്യാൻ മഹാകാളി പരമേശ്വരിയുടെ കോപക്കണ്ണിൽ നിന്നും പൊടിഞ്ഞുണ്ടായ ദേവിയാണ് രക്തചാമുണ്ഡി. പടനടുവിൽ തെറിച്ചുവീഴുന്ന ഓരോ ചോരത്തുള്ളിയിൽ നിന്നും ഓരോ അസുരൻമാർ പിറന്നപ്പോൾ കാളി വിഷണ്ണയായി...',
    'Raktachamundi is the goddess who emerged from the dust of the angry eyes of Mahakali Parameshwari to slay the demon Raktabeeja. When a new demon was born from every drop of blood that splattered on the battlefield, Kali became distressed...'],
  v:'അരനിമിഷകൊണ്ടസുരവരൻമാർ\nഅവനീതലത്തിലാകെ നിറഞ്ഞു...'}],
thH2:['തറവാട് ആസ്ഥാനമന്ദിരം','Tharavad Headquarters'],
apH:['കൊക്കാനിശ്ശേരി കണ്ടമ്പത്ത് തറവാട് ആസ്ഥാനമന്ദിരം','Kokkanisseri Kandambath Tharavad Headquarters'],
ap:['പ്രിയ കുടുംബാംഗങ്ങളെ, പ്രത്യേക ജനറൽബോഡി തീരുമാനപ്രകാരം തറവാടിന്റെ ആസ്ഥാനമന്ദിരം നിർമ്മിക്കുന്നതിലേക്ക് മുഴുവൻ കുടുംബാംഗങ്ങളുടെയും അകഴിഞ്ഞ സാമ്പത്തിക സഹകരണം അഭ്യർത്ഥിക്കുന്നു. — കൊക്കാനിശ്ശേരി കണ്ടമ്പത്ത് തറവാട് കമ്മിറ്റി','Dear Family Members, As per the decision of the special General Body, we request the wholehearted financial contribution and support of all family members towards the construction of the Tharavad headquarters building. — Kokkanisseri Kandambath Tharavad Committee'],
ctaH:['സംഭാവനയ്ക്കും വിവരങ്ങൾക്കും ബന്ധപ്പെടുക','To contribute or for details, contact']
};

function render(){
  document.documentElement.lang=S.lang;
  document.body.className=S.lang;
  const lk=document.getElementById('lk');
  lk.innerHTML=D.nav.map(n=>`<a href="${n[2]}">${T(n)}</a>`).join('')+`<button class="btn" id="lg">${S.lang==='ml'?'English':'മലയാളം'}</button>`;
  const d=D.days[S.day];
  document.getElementById('app').innerHTML=`
  <section class="hero" id="top">
    <div class="orn">❖ ✦ ❖</div>
    <h1>${T(D.title)}</h1><h2>${T(D.sub)}</h2>
    <div style="margin-top:18px"><span class="pill">📍 ${T(D.loc)}</span><span class="pill">☎ ${T(D.phone)}</span></div>
    <div class="pill" style="border-color:var(--gl);color:var(--gl)">🗓 ${T(D.dates)}</div>
    <div class="note rv">${T(D.intro)}</div>
  </section>
  <section id="program">
    <div class="sec-h rv"><h2>${T(D.progH)}</h2><i></i></div>
    <div class="tabs">${D.days.map((x,i)=>`<button class="tab ${i===S.day?'on':''}" data-d="${i}">${T(x.t)}</button>`).join('')}</div>
    <div class="tl">${d.e.map(e=>`<div class="card ev rv"><div class="time">${e[0]}</div>${S.lang==='ml'?e[1]:e[2]}</div>`).join('')}</div>
  </section>
  <section style="padding-top:0"><div class="feast rv"><h3>🪔 ${T(D.feastH)}</h3>${T(D.feast)}</div></section>
  <section id="theyyams">
    <div class="sec-h rv"><h2>${T(D.thH)}</h2><i></i></div>
    <div class="grid">${D.th.map((x,i)=>`<button class="card deity rv" data-t="${i}"><div class="ph">🔥</div><h3>${T(x.n)}</h3><small>${x.ep?T(x.ep):(x.b?T(D.tapHint):T(D.soon))}</small></button>`).join('')}</div>
  </section>
  <section id="tharavad">
    <div class="appeal rv">
      <h2 class="gold" style="font-size:clamp(22px,3.5vw,32px)">${T(D.apH)}</h2>
      <p>${T(D.ap)}</p>
      <div class="cta"><div>${T(D.ctaH)}</div><a href="tel:+919048325291">90 48 32 52 91</a></div>
    </div>
  </section>`;
  document.getElementById('ft').textContent='© 2026 '+T(D.title)+' · '+T(D.loc);
  bind();
}
function openM(i){
  const x=D.th[i],m=document.getElementById('mb');
  m.innerHTML=`<button class="x" aria-label="Close">×</button><h3>${T(x.n)}</h3>${x.ep?`<div class="ep">${T(x.ep)}</div>`:''}
  <p>${x.b?T(x.b):T(D.soon)}</p>${x.v&&S.lang==='ml'?`<div class="verse">${x.v}</div>`:''}${x.s?`<div class="src">— ${T(x.s)}</div>`:''}
  ${x.l?`<a class="btn" target="_blank" rel="noopener" href="${x.l[0]}">${T(x.l.slice(1))}</a>`:''}`;
  m.querySelector('.x').onclick=closeM;
  document.getElementById('md').classList.add('on');
}
function closeM(){document.getElementById('md').classList.remove('on')}
function bind(){
  document.getElementById('lg').onclick=()=>{S.lang=S.lang==='ml'?'en':'ml';render()};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;render();document.getElementById('program').scrollIntoView()});
  document.querySelectorAll('.deity').forEach(b=>b.onclick=()=>openM(+b.dataset.t));
  document.querySelectorAll('.links a').forEach(a=>a.onclick=()=>document.getElementById('lk').classList.remove('open'));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}
document.addEventListener('mousemove',e=>{
  const c=e.target.closest&&e.target.closest('.card');
  if(c){const r=c.getBoundingClientRect();c.style.setProperty('--x',(e.clientX-r.left)+'px');c.style.setProperty('--y',(e.clientY-r.top)+'px')}
});
document.getElementById('bg').onclick=()=>document.getElementById('lk').classList.toggle('open');
document.getElementById('md').onclick=e=>{if(e.target.id==='md')closeM()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
addEventListener('scroll',()=>{
  let cur='#top';
  D.nav.forEach(n=>{const el=document.querySelector(n[2]);if(el&&el.getBoundingClientRect().top<140)cur=n[2]});
  document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===cur));
},{passive:true});
render();
</script>
</body>
</html>
