<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A0404">
<meta name="description" content="Kokkanisseri Kandambathara Kaliyyatta Mahotsavam 2026 — December 3, 4, 5. Programme, sacred Theyyams and Tharavad appeal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🔥%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Kokkanisseri Kandambathara Kaliyyatta Mahotsavam 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&family=Manjari:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--red:#800000;--deep:#4A0404;--gold:#D4AF37;--gl:#FFD700;--ink:#121212;--ivory:#FDFBF7;--ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.3,1.4,.5,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:72px;height:100%;scrollbar-gutter:stable;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#4A0404 0,#121212 60%) fixed;color:var(--ivory);font:16px/1.7 'Manjari','Inter',sans-serif}
::selection{background:var(--gold);color:#2a0000}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#121212}::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold),var(--red));border-radius:6px}
:focus-visible{outline:2px solid var(--gl);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:'Cinzel','Manjari',serif;margin:0;line-height:1.25}
.en h1,.en h2,.en h3{font-family:'Cinzel',serif}
.gold{color:var(--gold)}
#embers{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
#app.sw{animation:sw .5s var(--ease)}
@keyframes sw{from{opacity:0;filter:blur(8px)}}

/* NAV */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid rgba(212,175,55,.3);transition:padding .3s,box-shadow .3s}
nav:before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(18,18,18,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .3s}
nav.sc{padding-block:6px;box-shadow:0 8px 30px rgba(0,0,0,.45)}nav.sc:before{background:rgba(18,18,18,.92)}
nav b{font-family:'Cinzel',serif;color:var(--gold);letter-spacing:.08em}
.bar{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:linear-gradient(90deg,var(--red),var(--gl));transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 10px var(--gl);pointer-events:none}
.links{display:flex;gap:6px;align-items:center}
.links a{position:relative;color:var(--ivory);text-decoration:none;padding:6px 12px;border-radius:99px;font-size:14px;transition:.3s}
.links a:after{content:"";position:absolute;left:50%;bottom:1px;width:0;height:2px;border-radius:2px;background:var(--gl);transform:translateX(-50%);transition:width .35s var(--spring)}
.links a:hover,.links a.on{background:rgba(212,175,55,.18);color:var(--gl);box-shadow:0 0 14px rgba(255,215,0,.3)}
.links a.on:after{width:36%}
.btn,.tab,.chip,.pn{position:relative;overflow:hidden}
.btn{background:linear-gradient(135deg,var(--gold),#a8841f);color:#2a0000;border:0;padding:8px 16px;border-radius:99px;font:700 14px 'Inter',sans-serif;cursor:pointer;text-decoration:none;display:inline-block;transition:.3s var(--ease)}
.btn:hover{box-shadow:0 0 22px rgba(255,215,0,.6);transform:translateY(-2px)}
.btn:active,.tab:active,.chip:active,.pn:active{transform:scale(.95)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.burger{display:none;position:relative;z-index:2;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:8px 9px;cursor:pointer}
.burger i{display:block;width:20px;height:2px;margin:4px 0;border-radius:2px;background:var(--gold);transition:.35s var(--ease)}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0;transform:scaleX(0)}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
@media(max-width:820px){
 .burger{display:block}
 .links{position:fixed;inset:0 0 0 auto;width:min(80vw,300px);flex-direction:column;align-items:stretch;padding:80px 20px;background:#1a0505;transform:translateX(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s;border-left:1px solid var(--gold)}
 .links a{font-size:18px;opacity:0;transform:translateX(24px);transition:opacity .4s var(--ease),transform .4s var(--ease),background .3s,color .3s}
 .menu .links{transform:none;visibility:visible;transition:transform .4s var(--ease)}
 .menu .links a,.menu .links .btn{opacity:1;transform:none}
 .menu .links>*:nth-child(1){transition-delay:.12s}.menu .links>*:nth-child(2){transition-delay:.18s}.menu .links>*:nth-child(3){transition-delay:.24s}.menu .links>*:nth-child(4){transition-delay:.3s}
 .menu .scrim{opacity:1;pointer-events:auto}
 .links .btn{opacity:0;transform:translateX(24px)}
}

/* LAYOUT */
section{max-width:1080px;margin:0 auto;padding:80px 20px}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.hero:before{content:"";position:absolute;width:520px;height:520px;max-width:90vw;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.22),transparent 65%);z-index:-1;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.orn{color:var(--gold);letter-spacing:.5em;font-size:20px;text-shadow:0 0 14px rgba(255,215,0,.6)}
.hero h1{font-size:clamp(30px,6vw,64px);background:linear-gradient(90deg,var(--gold),var(--gl),var(--gold),var(--gl),var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0;animation:sheen 7s linear infinite}
@keyframes sheen{to{background-position:100% 0}}
.hero h2{font-size:clamp(18px,3vw,28px);font-weight:500;color:var(--ivory)}
.pill{display:inline-block;margin:6px;padding:8px 18px;border:1px solid var(--gold);border-radius:99px;background:rgba(128,0,0,.35);backdrop-filter:blur(8px);transition:.3s var(--ease)}
@media(hover:hover){.pill:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(255,215,0,.3)}}
.cdl{margin-top:22px;color:var(--gold);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.cd{display:flex;gap:10px;justify-content:center;margin-top:8px}
.cd>div{min-width:70px;padding:10px 8px 8px;border:1px solid rgba(212,175,55,.45);border-radius:14px;background:rgba(128,0,0,.35);backdrop-filter:blur(8px)}
.cd b{display:block;font:700 28px/1.2 'Cinzel',serif;color:var(--gl);font-variant-numeric:tabular-nums}
.cd span{font-size:12px;letter-spacing:.08em;color:var(--gold)}
.cd.msg{display:block;padding:12px 22px;border:1px solid var(--gl);border-radius:99px;background:rgba(128,0,0,.4);color:var(--gl);font-weight:700}
.note{margin-top:28px;max-width:760px;background:var(--ivory);color:#2b1a1a;padding:24px 28px;border-radius:14px;border:2px solid var(--gold);font-family:'Playfair Display','Manjari',serif;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sec-h{text-align:center;margin-bottom:40px}.sec-h h2{font-size:clamp(26px,4vw,40px);color:var(--gold)}
.sec-h i{display:block;width:120px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);transition:transform 1.1s var(--ease) .3s}.sec-h.in i{transform:none}

/* TABS + TIMELINE */
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.tab{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.4);color:var(--ivory);padding:10px 20px;border-radius:12px;cursor:pointer;font:inherit;transition:.3s var(--ease)}
@media(hover:hover){.tab:hover{border-color:var(--gl);transform:translateY(-2px)}}
.tab.on{background:linear-gradient(135deg,var(--red),var(--deep));border-color:var(--gl);box-shadow:0 0 20px rgba(255,215,0,.35);color:var(--gl)}
.tl{border-left:2px solid var(--gold);margin-left:10px;padding-left:24px;display:grid;gap:16px}
.ev{position:relative;padding:16px 20px}
.ev:after{content:"";position:absolute;left:-34px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--gl);box-shadow:0 0 12px var(--gl);transition:.4s var(--spring)}
.ev:hover:after{transform:scale(1.5);box-shadow:0 0 22px var(--gl)}
.time{font:700 15px 'Cinzel',serif;color:var(--gl)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:500 13px 'Manjari','Inter',sans-serif;color:var(--gl);background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.4);border-radius:99px;padding:2px 12px;cursor:pointer;transition:.25s var(--ease)}
@media(hover:hover){.chip:hover{background:var(--gold);color:#2a0000;transform:translateY(-2px)}}

/* CARDS + REVEAL */
.rv{opacity:0;translate:0 28px;transition:opacity 1s var(--ease) var(--dl,0s),translate 1s var(--ease) var(--dl,0s)}
.rv.in{opacity:1;translate:none}
.card{position:relative;overflow:hidden;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(212,175,55,.3);border-radius:16px;transition:border-color .35s,box-shadow .35s,transform .25s var(--ease)}
.card.rv{transition:opacity .9s var(--ease) var(--dl,0s),translate .9s var(--ease) var(--dl,0s),border-color .35s,box-shadow .35s,transform .25s var(--ease)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),rgba(255,215,0,.22),rgba(128,0,0,.18) 45%,transparent 70%);opacity:0;transition:.3s;pointer-events:none;z-index:1}
.card:active:before{opacity:1}
@media(hover:hover){.card:hover{border-color:var(--gl);box-shadow:0 0 28px rgba(212,175,55,.4);transform:translateY(-3px)}.card:hover:before{opacity:1}}
.feast{text-align:center;padding:40px 24px;background:linear-gradient(135deg,rgba(128,0,0,.7),rgba(74,4,4,.9));border:2px solid var(--gl);border-radius:20px;animation:glow 3s ease-in-out infinite;font-size:20px}
.feast h3{color:var(--gl);font-size:26px;margin-bottom:10px}
.feast h3 span{display:inline-block;transform-origin:50% 90%;animation:flick 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px rgba(255,215,0,.2)}50%{box-shadow:0 0 50px rgba(255,215,0,.55)}}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.14) rotate(-4deg)}60%{transform:scale(.96) rotate(3deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.deity{cursor:pointer;text-align:center;padding-bottom:18px;font:inherit;color:inherit;width:100%}
@media(hover:hover) and (pointer:fine){
 .deity{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
 .deity:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px)}
}
.deity:active{transform:scale(.97)}
.ph{position:relative;overflow:hidden;height:190px;margin-bottom:14px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#2a0606,#2a0606 10px,#350909 10px,#350909 20px);color:var(--gold);font-size:46px}
.ph .fb{transition:opacity .5s;animation:flick 2.4s ease-in-out infinite}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:0;transform:scale(1.12);transition:opacity .7s,transform .9s var(--ease)}
.ph.ld img{opacity:1;transform:none}.ph.ld .fb{opacity:0}.ph.err img{display:none}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,215,0,.16) 50%,transparent 70%);background-size:200% 100%;animation:shim 1.5s linear infinite}
.ph.ld:after,.ph.err:after,.ph.noimg:after{display:none}
@keyframes shim{from{background-position:200% 0}to{background-position:-100% 0}}
.ph.ld:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 55%,rgba(18,18,18,.6));pointer-events:none}
.ph .go{position:absolute;right:10px;bottom:10px;z-index:2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 20px/1 'Inter',sans-serif;color:var(--gl);background:rgba(18,18,18,.7);border:1px solid var(--gold);opacity:0;transform:translateY(8px) scale(.7);transition:.35s var(--spring)}
@media(hover:hover){.deity:hover .ph.ld img{transform:scale(1.1)}.deity:hover .go,.deity:focus-visible .go{opacity:1;transform:none}}
@media(hover:none){.ph .go{opacity:.9;transform:none}}
.deity h3{font-size:18px;padding:0 12px;color:var(--ivory)}.deity small{color:var(--gold);display:block;margin-top:4px}

/* MODAL */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.modal.on{opacity:1;visibility:visible;transition:opacity .3s}
.mb{max-width:760px;width:100%;max-height:88vh;overflow:auto;overscroll-behavior:contain;background:var(--ivory);color:#2b1a1a;border:3px solid var(--gold);border-radius:18px;padding:28px;position:relative;outline:0;transform:translateY(34px) scale(.95);transition:transform .45s var(--spring)}
.modal.on .mb{transform:none}
.mb h3{color:var(--red);font-size:26px;padding-right:84px}.mb .ep{color:#8a6d1a;font-style:italic;margin-bottom:12px}
.mb p{white-space:pre-line}.verse{white-space:pre-line;border-left:4px solid var(--gold);background:#f6edd0;padding:12px 18px;margin:16px 0;font-style:italic}
.src{font-size:14px;opacity:.75}
.mimg{position:relative;height:clamp(210px,40vh,360px);margin:-6px -6px 18px;border-radius:12px;overflow:hidden;border:2px solid var(--gold);background:repeating-linear-gradient(45deg,#2a0606,#2a0606 10px,#350909 10px,#350909 20px)}
.mimg img{width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:0;transform:scale(1.06);transition:opacity .7s,transform 1.2s var(--ease)}
.mimg.ld img{opacity:1;transform:none}.mimg.err{display:none}
.mimg:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,215,0,.18) 50%,transparent 70%);background-size:200% 100%;animation:shim 1.5s linear infinite}
.mimg.ld:after{display:none}
.x{position:absolute;right:14px;top:12px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(253,251,247,.92);border:1px solid rgba(212,175,55,.6);font-size:24px;line-height:1;color:var(--red);cursor:pointer;transition:.3s var(--spring)}
.x:hover{transform:rotate(90deg) scale(1.1);background:#fff}
.mlg{position:absolute;right:58px;top:12px;z-index:3;height:36px;padding:0 12px;border-radius:99px;background:rgba(253,251,247,.92);border:1px solid rgba(212,175,55,.6);color:var(--red);font:700 13px 'Inter',sans-serif;cursor:pointer;transition:.25s var(--ease)}
.mlg:hover{background:var(--red);color:var(--gl)}
.mb .btn{margin-top:14px;background:linear-gradient(135deg,var(--red),var(--deep));color:var(--gl)}
.mnav{display:flex;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid rgba(212,175,55,.5)}
.pn{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid var(--red);background:none;color:var(--red);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.3s var(--ease)}
.pn:first-child{text-align:left}.pn:last-child{text-align:right}
@media(hover:hover){.pn:hover{background:var(--red);color:var(--gl);transform:translateY(-2px)}}

/* APPEAL / CTA */
.appeal{padding:44px 28px;text-align:center;border-radius:20px;background:linear-gradient(160deg,rgba(128,0,0,.55),rgba(18,18,18,.8));border:1px solid var(--gold)}
.appeal p{max-width:700px;margin:16px auto}
.cta{margin-top:24px;display:inline-block;padding:20px 32px;border:2px dashed var(--gl);border-radius:16px;background:rgba(0,0,0,.35);animation:ring 3s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,215,0,.4)}70%,100%{box-shadow:0 0 0 18px rgba(255,215,0,0)}}
.cta .row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.cta a{font:700 26px 'Cinzel',serif;color:var(--gl);text-decoration:none;transition:.3s}
.cta a:hover{text-shadow:0 0 18px var(--gl)}
footer{text-align:center;padding:30px 20px 50px;color:var(--gold);opacity:.8;font-size:14px}

/* FLOATING */
.top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:46px;height:46px;border:0;border-radius:50%;padding:0;cursor:pointer;color:var(--gl);font:700 20px 'Inter',sans-serif;background:conic-gradient(var(--gl) calc(var(--p,0)*1%),rgba(212,175,55,.25) 0);opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:opacity .4s,transform .4s var(--spring),box-shadow .3s}
.top:before{content:"";position:absolute;inset:3px;border-radius:50%;background:#2a0505}
.top span{position:relative;display:block;transition:transform .3s var(--spring)}
.top.on{opacity:1;transform:none;pointer-events:auto}
.top:hover{box-shadow:0 0 22px rgba(255,215,0,.55)}.top:hover span{transform:translateY(-3px)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,24px) scale(.9);opacity:0;pointer-events:none;background:var(--ivory);color:#2a0000;border:2px solid var(--gold);padding:10px 22px;border-radius:99px;font:700 14px 'Inter','Manjari',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.45s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;translate:none}.sec-h i{transform:none}}
</style>
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<nav>
  <b>KANDAMBATHARA</b>
  <button class="burger" id="bg" aria-label="Menu" aria-expanded="false" aria-controls="lk"><i></i><i></i><i></i></button>
  <div class="links" id="lk"></div>
  <div class="bar" id="bar"></div>
</nav>
<div class="scrim" id="scrim"></div>
<main id="app"></main>
<div class="modal" id="md" aria-hidden="true"><div class="mb" id="mb" role="dialog" aria-modal="true" aria-labelledby="mt" tabindex="-1"></div></div>

<script>
const S={lang:'ml',day:0};
const T=(a)=>a[S.lang==='ml'?0:1];
const D={
nav:[['ഉത്സവം','Home','#top'],['പരിപാടികൾ','Program','#program'],['തെയ്യങ്ങൾ','Theyyams','#theyyams'],['തറവാട്','Tharavad','#tharavad']],
title:['കൊക്കാനിശ്ശേരി കണ്ടമ്പത്തറ','Kokkanisseri Kandambathara'],
sub:['കളിയാട്ട മഹോത്സവം 2026','Kaliyyatta Mahotsavam 2026'],
loc:['കൊക്കാനിശ്ശേരി, പയ്യന്നൂർ','Kokkanisseri, Payyanur'],

 {n:['മടയിൽ ചാമുണ്ഡി','Madayil Chamundi'],ep:['പാതാളമൂർത്തി','Pathalamurthi'],
  b:['പാതാളമൂർത്തി എന്നുകൂടി വിളിപ്പേരുള്ള ഈ മഹാകാളി ചണ്ഡമുണ്ഡന്മാർ ഒളിച്ചു പാതാളത്തോളം പിന്തുടർന്ന കൊടിയ ഭൈരവിയാണ്. ആലന്തട്ട വനത്തിൽ നായാട്ടിനിറങ്ങിയ വണ്ണാടിൽ പൊതുവാളുടെ പിന്നാലെ കൊടുങ്കാറ്റുപോലെ മടയിൽ നിന്നും പാഞ്ഞോടി വന്ന ദേവി മടയിൽച്ചാമുണ്ഡിയായി ആദ്യാ ആരൂഢമായ ആലന്തട്ട മടവാത്തിലും പിന്നെ തിമിരിഗോപുരത്തിലും കരിവെള്ളൂർ കോട്ടൂരിൽ പയ്യന്നൂർ വണ്ണാടി മീനക്കൊട്ടിലും ശേഷിപ്പെട്ടു. അവിടെ നിന്നാണ് അമ്മോൺപെരുമാളുടെ അനുവാദത്തോടെ അനേകം കാവുകളിലേക്ക് എഴുന്നള്ളിയത്.\n\nമടയിൽച്ചാമുണ്ഡി മറ്റു പേരുകളിട്ടും കെട്ടിയാടിച്ചു വരുന്നുണ്ട്. ആനമടച്ചാമുണ്ഡി, ബലിച്ചേരിചാമുണ്ഡി, മേനച്ചൂർചാമുണ്ഡി, കരിമണൽ ചാമുണ്ഡി, മാമലച്ചാമുണ്ഡി തുടങ്ങിയ പേരുകളാണ് അവ. തെയ്യത്തോറ്റങ്ങളിൽ അതീവ ഹൃദ്യതരമാണ് മടയിൽച്ചാമുണ്ഡിത്തോറ്റം.',
    'This Mahakali, also known by the epithet Pathalamurthi (Goddess of the Netherworld), is a fierce Bhairavi who pursued Chanda and Munda all the way down to the netherworld. Rushing out like a whirlwind from her lair behind Vannadil Pothuval in the Alanthatta forest, the Goddess first enshrined herself at Alanthatta Madavath. Later, her divine presence was established at Thimiri Gopuram, Karivellur Kottur, and Payyannur Vannadil Meenakkottil...'],
  v:'യമണ്ടിയാം മടയകത്ത-\nങ്ങുതകിയ മടപാതാളം\nകരുമണൽ താമളത്തോ-\nടഴകേറുമാലത്തട്ട\nമടവാതിൽ മഹിമതങ്കും\nവണ്ണാടി മീനക്കൊട്ടിൽ\nനിലയേറുമധിഷ്ഠാനങ്ങൾ\nനിലനിന്നുകൊണ്ട മായേ...',
  s:['ഡോ. ആർ. സി. കരിപ്പത്ത്, തെയ്യപ്രപഞ്ചം','Theyyaprapancham by Dr. R. C. Karipath'],
  l:['https://ml.wikisource.org/wiki/മടയിൽ_ചാമുണ്ഡി_തെയ്യം_(തോറ്റങ്ങൾ)','മടയിൽ ചാമുണ്ഡി തോറ്റം ↗ തോറ്റം പാട്ടുകൾ മലയാളം വിക്കിഗ്രന്ഥശാലയിൽ വായിക്കാം','Read Madayil Chamundi Thottam Songs on Wikisource ↗']},
 {n:['വിഷ്ണുമൂർത്തി','Vishnumoorthy'],
  b:['(മലയാളം വിവരണം ഉടൻ — ഇംഗ്ലീഷ് പാഠം താഴെ)\n\nThe story of the Vishnu Moorthy Theyyam is associated with a Thiyya youth who was a cowherd in the village of Koyamburam near Nileshwaram, three centuries ago. Kannan’s job was to graze the cattle of the feudal lord known as Kuruwatt Kurup. Kurup’s niece fell in love with Kannan, and upon learning of this, Kannan ran away to Mangalore. Having spent five years as a priest and daily worshipper of Narasimhamurthi, Kannan returned to Nileshwaram where Kuruwatt Kurup slit his throat at Kadalikkulam. Ominous signs were witnessed throughout the land. As an expiation, Kurup built a kavu for Narasimhamurthi (Vishnu Moorthy) at Kottappuram...',
    'The story of the Vishnu Moorthy Theyyam is associated with a Thiyya youth who was a cowherd in the village of Koyamburam near Nileshwaram, three centuries ago. Kannan’s job was to graze the cattle of the feudal lord known as Kuruwatt Kurup. Kurup’s niece fell in love with Kannan, and upon learning of this, Kannan ran away to Mangalore. Having spent five years as a priest and daily worshipper of Narasimhamurthi, Kannan returned to Nileshwaram where Kuruwatt Kurup slit his throat at Kadalikkulam. Ominous signs were witnessed throughout the land. As an expiation, Kurup built a kavu for Narasimhamurthi (Vishnu Moorthy) at Kottappuram...']},
 {n:['രക്തചാമുണ്ഡി','Raktha Chamundi'],
  b:['രക്തബീജാസുരനെ നിഗ്രഹം ചെയ്യാൻ മഹാകാളി പരമേശ്വരിയുടെ കോപക്കണ്ണിൽ നിന്നും പൊടിഞ്ഞുണ്ടായ ദേവിയാണ് രക്തചാമുണ്ഡി. പടനടുവിൽ തെറിച്ചുവീഴുന്ന ഓരോ ചോരത്തുള്ളിയിൽ നിന്നും ഓരോ അസുരൻമാർ പിറന്നപ്പോൾ കാളി വിഷണ്ണയായി...',
    'Raktachamundi is the goddess who emerged from the dust of the angry eyes of Mahakali Parameshwari to slay the demon Raktabeeja. When a new demon was born from every drop of blood that splattered on the battlefield, Kali became distressed...'],
  v:'അരനിമിഷകൊണ്ടസുരവരൻമാർ\nഅവനീതലത്തിലാകെ നിറഞ്ഞു...'}],
thH2:['തറവാട് ആസ്ഥാനമന്ദിരം','Tharavad Headquarters'],
apH:['കൊക്കാനിശ്ശേരി കണ്ടമ്പത്ത് തറവാട് ആസ്ഥാനമന്ദിരം','Kokkanisseri Kandambath Tharavad Headquarters'],
ap:['പ്രിയ കുടുംബാംഗങ്ങളെ, പ്രത്യേക ജനറൽബോഡി തീരുമാനപ്രകാരം തറവാടിന്റെ ആസ്ഥാനമന്ദിരം നിർമ്മിക്കുന്നതിലേക്ക് മുഴുവൻ കുടുംബാംഗങ്ങളുടെയും അകഴിഞ്ഞ സാമ്പത്തിക സഹകരണം അഭ്യർത്ഥിക്കുന്നു. — കൊക്കാനിശ്ശേരി കണ്ടമ്പത്ത് തറവാട് കമ്മിറ്റി','Dear Family Members, As per the decision of the special General Body, we request the wholehearted financial contribution and support of all family members towards the construction of the Tharavad headquarters building. — Kokkanisseri Kandambath Tharavad Committee'],

Object.assign(D.th[4],{
b:[`പാതാളമൂർത്തി എന്നുകൂടി വിളിപ്പേരുള്ള ഈ മഹാകാളി ചണ്ഡമുണ്ഡന്മാർ ഒളിച്ചു പാതാളത്തോളം പിന്തുടർന്ന കൊടിയ ഭൈരവിയാണ്. ആലന്തട്ട വനത്തിൽ നായാട്ടിനിറങ്ങിയ വണ്ണാടിൽ പൊതുവാളുടെ പിന്നാലെ കൊടുങ്കാറ്റുപോലെ മടയിൽ നിന്നും പാഞ്ഞോടി വന്ന ദേവി മടയിൽച്ചാമുണ്ഡിയായി ആദ്യാ ആരൂഢമായ ആലന്തട്ട മടവാത്തിലും പിന്നെ തിമിരിഗോപുരത്തിലും കരിവെള്ളൂർ കോട്ടൂരിൽ പയ്യന്നൂർ വണ്ണാടി മീനക്കൊട്ടിലും ശേഷിപ്പെട്ടു. അവിടെ നിന്നാണ് അമ്മോൺപെരുമാളുടെ അനുവാദത്തോടെ അനേകം കാവുകളിലേക്ക് എഴുന്നള്ളിയത്.\n\nമടയിൽച്ചാമുണ്ഡി മറ്റു പേരുകളിട്ടും കെട്ടിയാടിച്ചു വരുന്നുണ്ട്. ആനമടച്ചാമുണ്ഡി, ബലിച്ചേരിചാമുണ്ഡി, മേനച്ചൂർചാമുണ്ഡി, കരിമണൽ ചാമുണ്ഡി, മാമലച്ചാമുണ്ഡി തുടങ്ങിയ പേരുകളാണ് അവ. തെയ്യത്തോറ്റങ്ങളിൽ അതീവ ഹൃദ്യതരമാണ് മടയിൽച്ചാമുണ്ഡിത്തോറ്റം.`,
`This Mahakali, also known by the epithet Pathalamurthi (Goddess of the Netherworld), is a fierce Bhairavi who pursued Chandan and Munda all the way down to the netherworld (Pathala). Rushing out like a whirlwind from her lair (mada) behind Vannadil Pothuval, who had gone hunting in the Alanthatta forest, the Goddess first enshrined herself as Madayil Chamundi at Alanthatta Madavath. Later, her divine presence was established at Thimiri Gopuram, Karivellur Kottur, and Payyannur Vannadil Meenakkottil. It was from there, with the permission of Ammon Perumal, that she was solemnly taken in procession to numerous sacred groves (kavus).\n\nMadayil Chamundi is also performed (in Theyyam) under various other names, such as Anamadachamundi, Baliccherichamundi, Menacchurchamundi, Karimanal Chamundi, and Mamalachamundi. Among the Theyyam ritual songs (Thottam), the Madayil Chamundi Thottam is particularly captivating and heart-touching.`],
ve:`Yamandiyāma maḍayakaththaṅguthakiya maḍapāthāḷam\nKarumaṇal thāmaḷathōdaḻakērumālatthatta\nMaḍavāthil mahimathaṅgum Vaṇṇādi mīnakkoṭṭil\nNilayērumadhiṣṭhānṅaḷ Nilaninnukhoṇḍa māyē`,
a:[`എന്നു തുടങ്ങുന്ന സ്തുതിയിലും 'ആദിതാനാദിത്യാനാദിതാന്‍ മൂർത്തിനീ-യമ്പോടുടൻ കലർന്നുണ്ടായ ഭൈരവി' എന്നാരംഭിക്കുന്ന തോറ്റത്തിലും ദേവിയുടെ കേശാദിപാദവർണ്ണന കാണാം.`,
`A detailed description of the Goddess from head to toe (Keshadipada Varnana) can be found in the hymn above, and also in the Thottam song starting with:\n\nĀditānādityānāditān mūrthinī-yambōṭuḍan kalarṇunḍāya bhairavi`]});
const VE=`The story of the Vishnu Moorthy Theyyam is associated with a Thiyya youth who was a cowherd in the village of Koyamburam near Nileshwaram, three centuries ago. Kannan’s job was to graze the cattle of the feudal lord known as Kuruwatt Kurup. Kurup’s niece fell in love with Kannan, and upon learning of this, Kannan ran away and escaped from the henchmen who rushed to kill him. Having sought refuge in a Thiyya ancestral house called Koilpadi in Mangalore to the north, Kannan was welcomed by its matriarch (grandmother) as if he were her own son. After spending five years as a priest and daily worshipper of Narasimhamurthi, the family deity of the house, Kannan felt a strong desire to see his homeland. Bidding farewell and promising to return soon, the young man stepped out, arrived in Nileshwaram, and went down to bathe in the Kadalikkulam (plantain pond/tank). Upon learning of this, Kuruwatt Kurup rushed there and slit Kannan’s throat. Ominous signs were witnessed throughout the land.\n\nKurup’s ancestral home trembled. As a form of expiation, Kurup built a kavu (sacred grove) for Narasimhamurthi (Vishnu Moorthy) at Kottappuram. He conducted the kaliyattam (Theyyam festival), and the Theyyam form of Palanthai Kannan was also performed here. Today, not only the Thiyya community, but people from all communities are devotees of this Theyyam.`;
const VE2=`It is said that Kannan was a priest to Narasimhamurthy at the Mangalappuram Koyil Kurippadi. In this story, one can witness the devotional ecstasy of Prahlada, the son of Hiranya who was an enemy of Narayana, as well as the paternal anger of the father preparing to kill his son because of it. To Hiranya’s question, “Where is your Narayana?”, the reply given was, “The all-pervading Lord Narayana is present even in this palace pillar.” At that twilight hour, when [Hiranya] struck the pillar with a sword, a terrifying form combining a lion and a man appeared from within it. Narasimha laid Hiranya down on the threshold and killed him by tearing open his belly with his fingernails. Portraying these Bhagavata mythological scenes in the Vishnumoorthy Theyyam shrine is a captivating sight.`;

Object.assign(D.th[6],{
b:[`രക്തബീജാസുരനെ നിഗ്രഹം ചെയ്യാൻ മഹാകാളി പരമേശ്വരിയുടെ കോപക്കണ്ണിൽ നിന്നും പൊടിഞ്ഞുണ്ടായ ദേവിയാണ് രക്തചാമുണ്ഡി. പടനടുവിൽ തെറിച്ചുവീഴുന്ന ഓരോ ചോരത്തുള്ളിയിൽ നിന്നും ഓരോ അസുരൻമാർ പിറന്നപ്പോൾ കാളി വിഷണ്ണയായി.`,`Raktachamundi is the goddess who emerged from the dust of the angry eyes of Mahakali Parameshwari to slay the demon Raktabeeja. When a new demon was born from every drop of blood that splattered on the battlefield, Kali became distressed.`],
v:`അരനിമിഷകൊണ്ടസുരവരൻമാർ\nഅവനീതലത്തിലാകെ നിറഞ്ഞു\nഅരുതരുതിവനെ കൊൽവതിനെതൊരു\nകഴിവെന്നിങ്ങനെ ചിന്തിച്ചുമ്പിക\nഅതികുപിതനിയതൊരു സമയേ\nതിരുമിഴിയിൽ പിറന്നൊരു രൂപം\nഹരഹര നിരൂപിച്ചാൽ പാരനന്ദൻ-\nതരുതുരഗാധിപനും ഗുഹനും\nഈ ദേവതയുടെ ചമയങ്ങളോ...\nകുത്തും കനകസന്വിതമായൊരു\nപൂത്തൻ നല്ല കിരീടം ചാർത്തി\nമെത്തുമതിന്റെ പുറമേ നല്ലൊരു\nവൃതമായ പുറത്തു തിനുടെ\nചുറ്റും പീലികൾ കെട്ടിമുറുക്കി\nപട്ടുകൾ പലതരമായ നിറത്തോടു\nദൃഷ്ടിക്കമൃതം തന്നെയിതോർത്താൽ.`,
ve:`In half a moment, the chief demons\nFilled the entire surface of the earth.\nThinking, “Alas, what power is there to kill this one?”\nAt that very furious moment,\nThe form that was born from her sacred eyes—\nIf one contemplates it, Hara Hara, to the joy of the world—\nAlong with the Lord of Serpents and Guhan.\nThe adornments of this deity...\nWearing a fine, golden-studded,\nBlooming, beautiful crown,\nOver and above that,\nTied tightly with peacock feathers around\nIts sacred outer back,\nWith various colors of silk,\nTruly a feast for the eyes to behold.`,
a:[`ചഞ്ചലമായ ജിഹ്വയുമായി രക്തം കോരിക്കോരി കുടിച്ച് ഭീതി വിതച്ച ദേവി 'രക്തേ മുഴുക്കീ'മൂലം രക്തചാമുണ്ഡേശ്വരി എന്നൊരു നാമം ധരിച്ചതാണ്.\n\nഇതേ ചാമുണ്ഡിദേവിയെ ആയിരത്തെങ്ങിൽ ചാമുണ്ഡി, കുട്ടിക്കരചാമുണ്ഡി, മുട്ടിയരചാമുണ്ഡി, കിഴക്കേചാമുണ്ഡി, നീലക്കെചാമുണ്ഡി, എടപ്പന്ന ചാമുണ്ഡി, പെരിയാട്ടുചാമുണ്ഡി, കാരേൽചാമുണ്ഡി, പ്ലാട്ടുക്കചാമുണ്ഡി, വീരചാമുണ്ഡി, ബാലിച്ഛേരി ചാമുണ്ഡി, കരിശ്ശേരി ചാമുണ്ഡി, തുടങ്ങി രേഖപ്പെടുത്താൻ കഴിഞ്ഞ 20ൽ പരം പേരുകളിൽ കുടികൊള്ളുന്ന സ്ഥാനങ്ങളുണ്ട്. അതതു ഗ്രാമപ്പെരിട്ടും അത്ഭുതകൃത്യങ്ങളുടെ പേരിലും കുടികൊള്ളുന്ന സ്ഥാനങ്ങളുടെ പേരുമാണ് ദേവി വിളിക്കപ്പെടുന്നത്. ഈ ഭഗവതിയെത്തന്നെ രക്തേശ്വറിയായും ആരാധിച്ചുവരുന്നുണ്ട്.`,
`With a flickering tongue, scooping up and drinking blood, and spreading fear, the goddess took on the name Raktachamundeshwari due to being “immersed in blood” (rakte muzhukki).\n\nThis same Chamundi deity resides in places known by over 20 recorded names, such as Aayiranthengil Chamundi, Kuttikkara Chamundi, Muttiyara Chamundi, Kizhakke Chamundi, Neelakke Chamundi, Edappanna Chamundi, Periyattu Chamundi, Kareel Chamundi, Plattukka Chamundi, Veera Chamundi, Balissheri Chamundi, and Karissheri Chamundi. The goddess is addressed by the names of these abodes, which are based on respective village names or miraculous deeds. This same Goddess is also worshipped as Rakteshwari.`]});

Object.assign(D.th[0],{n:['കന്നിക്കൊരുമകൻ തെയ്യം','Kannikkorumakan Theyyam'],
ep:['മാനിച്ചേരി ദൈവം · വൈദ്യനാഥൻ ധന്വന്തരി ദൈവം','Manicheri Deavam · Vaidyanathan Dhanwanthari Deavam'],
b:[`വനദേവതമാരുടെ ഗണത്തിൽപ്പെടുന്ന പ്രധാനപ്പെട്ട ഒരു തെയ്യമാണ് കന്നിക്കൊരുമകൻ തെയ്യം. ജീവിച്ചിരുന്ന ഒരു വില്ലാളിയുടെ ജീവിതകഥയുമായി ബന്ധപ്പെട്ടാണ് ഈ തെയ്യം കെട്ടിയാടുന്നത്. മാനിച്ചേരി ദൈവം, വൈദ്യനാഥൻ ധന്വന്തരി ദൈവം എന്നീ പേരുകളിലും ഈ തെയ്യം അറിയപ്പെടുന്നുണ്ട്.\n\nപിതൃവാടിക്കോട്ടയിലെ രാജാവിന്റെ സഹോദരിയായിരുന്ന അക്കം എന്ന പെൺകുട്ടിയെ, അവളുടെ ആഭരണങ്ങൾ കവർച്ച ചെയ്യുക എന്ന ലക്ഷ്യത്തോടെ ചെറുപ്രായത്തിൽ ചില കൊള്ളക്കാർ തട്ടിക്കൊണ്ടുപോയി. എന്നാൽ അതീവ സമർത്ഥയായ ആ പെൺകുട്ടി കൊള്ളക്കാരുടെ പിടിയിൽ നിന്നും കഷ്ടപ്പെട്ട് രക്ഷപ്പെടുകയും ഒടുവിൽ കുടകിൽ എത്തിച്ചേരുകയും ചെയ്തു. അവിടെ ആരുടേയും സഹായമില്ലാതെ അനാഥയായി കഴിഞ്ഞുകൂടിയ അവൾ കടുത്ത ഒരു ശിവഭക്തയായി മാറി.\n\nതനിച്ചുജീവിച്ചിരുന്ന ആ കന്യക, തനിക്കൊരു സന്താനഭാഗ്യത്തിനായി മഹാദേവനെ മനസ്സുരുകി പ്രാർത്ഥിച്ചു. ഭക്തയുടെ പ്രാർത്ഥനയിൽ പ്രസാദിച്ച പരമശിവൻ, അവൾക്ക് ഒരു പുത്രൻ ജനിക്കട്ടെ എന്ന് അനുഗ്രഹിക്കുകയും ആ ഗർഭം ഒരു കരിങ്കല്ലിൽ ആവാഹിച്ചു കൊടുക്കുകയും ചെയ്തു. പിന്നീട് ആ കരിങ്കല്ല് പിളർന്നു ഒരു ആൺകുട്ടി പിറന്നു. ആ കുഞ്ഞാണ് കന്നിക്കൊരുമകൻ.\n\nവാക്കത്തൂർ കേളു എന്ന് പേരിട്ടു വിളിച്ച ആ കുട്ടി സകലകലാവല്ലഭനും അതിസമർത്ഥനുമായിരുന്നു. കൗമാരപ്രായത്തിൽ തന്നെ അവൻ എല്ലാ അടവുകളും പഠിച്ച ഒരു തികഞ്ഞ ചേകവനായി വളർന്നു.\n\nതാൻ പിതൃവാടിക്കോട്ടയിലെ രാജാവിന്റെ അനന്തരവനാണെന്ന് മനസ്സിലാക്കിയ അവൻ, തന്റെ വേരുകൾ തേടി പിതൃവാടിക്കോട്ടയിലേക്ക് യാത്ര തിരിച്ചു. യാത്ര പുറപ്പെടുമ്പോൾ അടയാളമായി അമ്മ അവന് ഒരു പവിഴമാല അണിയിച്ചു കൊടുത്തിരുന്നു.\n\nകോട്ടയ്ക്കൽ എത്തിയ അവനെ അമ്മാവൻ തിരിച്ചറിഞ്ഞില്ല. തുടർന്ന് അവ തമ്മിൽ കടുത്ത യുദ്ധമുണ്ടായി. ആ യുദ്ധത്തിൽ മരുമകൻ വിജയം വരിച്ചു. തുടർന്ന് അമ്മ നൽകിയ അടയാളങ്ങൾ കാണിച്ചുകൊടുത്തതോടുകൂടി, വന്നത് തന്റെ സഹോദരിയുടെ മകൻ തന്നെയാണെന്ന് അമ്മാവന് ബോധ്യപ്പെടുകയും, പിന്നീട് അവനെ പിതൃവാടിക്കോട്ടയിലെ രാജാവായി വാഴിക്കുകയും ചെയ്തു.\n\nഇങ്ങനെ കന്യകയ്ക്ക് പിറന്ന ആ പുത്രനെയാണ് മലനാട്ടിൽ കന്നിക്കൊരുമകൻ എന്ന പേരിൽ തെയ്യമായി കെട്ടിയാടുന്നത്.`,
`Kannikkorumakan Theyyam is an important Theyyam that belongs to the category of forest deities (Vana Devatas). This Theyyam is performed in connection with the life story of a real-life archer who once lived. This Theyyam is also known by the names Manicheri Deavam and Vaidyanathan Dhanwanthari Deavam.\n\nA young girl named Akkam, who was the sister of the King of Pithruvaadilkkotta, was abducted at an early age by robbers who aimed to steal her jewelry. However, being extremely clever, she managed to escape from the robbers’ grip with great difficulty and eventually reached Coorg (Kodagu). Living there alone without anyone’s support, she grew up to become a devout worshiper of Lord Shiva.\n\nLiving in solitude, the maiden prayed fervently to Mahadeva (Lord Shiva) for the blessing of a child. Pleased with her devotion, Lord Shiva blessed her to have a son and consecrated the divine pregnancy into a black stone. Later, that black stone burst open, and a boy was born. That child is Kannikkorumakan.\n\nNamed Vakkathoor Kelu, the boy was highly talented and exceptionally skilled in all arts. By the time he reached adolescence, he had mastered all fighting techniques and grown into a complete Chekavar (warrior).\n\nUpon realizing that he was the nephew of the King of Pithruvaadilkkotta, he set out on a journey toward Pithruvaadilkkotta in search of his roots. As a mark of identification before his departure, his mother placed a coral necklace around his neck.\n\nWhen he arrived at the fort, his uncle failed to recognize him, which led to a fierce battle between them. The nephew emerged victorious in the duel. After the battle, when he revealed the identification mark given by his mother, the uncle realized that the young warrior was indeed his sister’s son. He subsequently crowned him as the King of Pithruvaadlikkotta.\n\nIt is this son born to the maiden who is performed as the Theyyam known as Kannikkorumakan in the Malanad region.`]});
Object.assign(D.th[1],{s:SRC,b:['ദേവാസുരയുദ്ധമധ്യേ പട ജയിക്കാൻ അവതരിച്ച യുദ്ധദേവത. പടുവളനാട്ടിൽ നാടുവാഴികൾ ഏറ്റുമുട്ടിയപ്പോൾ ഒരുപക്ഷം ചേർന്ന് യുദ്ധം നയിച്ച മൂന്നു ദൈവങ്ങളിൽ ഒന്ന്. പടുവളത്തിൽപരദേവത എന്നപേരിലും അറിയപ്പെടുന്നു.','A war goddess who incarnated to win the battle amidst the war between Devas and Asuras (gods and demons). When local rulers clashed in Paduvalanad, she was one of the three deities who joined one side and led the war. She is also known by the name Paduvalathil Paradevatha.']});
Object.assign(D.th[2],{n:['പണയക്കാട്ട് ഭഗവതി','Panayakkattu Bhagavathi'],s:['Theyyakkalam','Theyyakkalam'],
b:[`യാദവ സമുദായത്തിന്റെ കുലദേവതയായി ആരാധിക്കപ്പെടുന്ന തെയ്യമാണ് പണയക്കാട്ടു ഭഗവതി. ചന്ദ്രനെല്ലൂർ ഭഗവതിയുടെ സ്വരൂപമായാണ് ഈ ദേവിയെ കരുതുന്നത്. അസുരനിഗ്രഹത്തിനായി ചുരികയും ശൂലവും കയ്യിലേന്തിയ രണദേവതയായിട്ടാണ് ഭഗവതിയെ കെട്ടിയാടുന്നത്.\n\nപ്രമേയങ്ങളും ഐതിഹ്യങ്ങളും\n\nവാമൊഴിയറിവുകളിലെ കഥ: കൃഷ്ണന് പകരം പണയം സമർപ്പിക്കപ്പെട്ടതിനാലാണ് ദേവിക്ക് പണയക്കാട്ടു ഭഗവതി എന്ന പേര് വന്നതെന്നാണ് പ്രാദേശികമായ ഒരു വാമൊഴികഥ. എന്നാൽ ഈ സംഭവം തോറ്റം പാട്ടിൽ പരാമർശിക്കുന്നില്ല; കേട്ടുകേൾവി മാത്രമായി നിലനിൽക്കുന്ന ഒന്നാണിത്.\n\nതോറ്റം പാട്ടിലെ പശ്ചാത്തലം: തോറ്റം പാട്ട് അനുസരിച്ച്, ഉതിരവെള്ളപ്പേരാറിൽ നിന്നാണ് ഭഗവതിയുടെ ആവിർഭാവം. തുടർന്ന് കാളകാട്, ചന്ദ്രനെല്ലൂർ എന്നിവിടങ്ങളിൽ സാന്നിധ്യമറിയിച്ച ദേവിയുടെ ആരാധന പിന്നീട് വടക്കൻ കേരളത്തിലെ നിരവധിയായ കാവുകളിലേക്ക് വ്യാപിക്കുകയായിരുന്നു.\n\nഭ്രാന്ത് പരദേവത: ഭഗവതിയുടെ മറ്റൊരു നാമവിശേഷണമാണ് ഭ്രാന്ത് പരദേവത. ശിവനും പാർവ്വതിയും വേഷപ്രച്ഛന്നരായി പ്രാന്തവനം വഴി സഞ്ചരിച്ചപ്പോൾ അവർക്ക് ചിത്തഭ്രമം സംഭവിക്കുകയും, ആ സമയത്ത് അവർക്കൊരു ദിവ്യപുത്രി ജനിക്കുകയും ചെയ്തുവെന്നാണ് ഐതിഹ്യം. അങ്ങനെയുണ്ടായ തേജസ്വിനിയായ ബാലിക പിന്നീട് മലനാടൊട്ടാകെ സഞ്ചരിച്ച് വിവിധ കാവുകളിൽ കുടിയിരുന്നു. ആ ദിവ്യപുത്രിയെത്തന്നെയാണ് ശക്തിയുടെയും അന്നപൂർണ്ണേശ്വരിയുടെയും സ്വരൂപമായ പണയക്കാട്ടു ഭഗവതിയായി സങ്കൽപ്പിച്ചുപോരുന്നത്.`,
`Panayakkattu Bhagavathy is revered as the Kuladevata (clan deity) of the Yadava community and is considered an incarnation of Chandranellur Bhagavathy. Armed with a curved sword and a trident (shoola), she is worshipped as a Rana Devata (war goddess), representing the fierce power that destroys demons (asuras).\n\nOrigin Legends and Folklore\n\nThe Oral Tradition: According to local folklore, the goddess earned the name Panayakkattu Bhagavathy because she was once given as a pledge (panayam) in place of Lord Krishna. However, this story is preserved solely through oral legend and is not recorded in the ritual song (Thottam Pattu).\n\nThe Thottam Pattu Account: The sacred Thottam tradition presents a different origin. It states that the goddess originated from Uthiravellapperar and later consecrated her presence at Kalakadu and Chandranellur. From these holy sites, her worship expanded across various sacred groves (Kavu) throughout northern Kerala.\n\nPranthu Paradevatha Legend: Another belief associates her with the title Pranthu Paradevatha (“Guardian Deity of Madness”). Legend has it that when Lord Shiva and Goddess Parvati wandered in disguise through Prantha Vanam (the Forest of Madness), they were briefly afflicted by divine madness. During this period, a celestial daughter was born to them. This divine child later traveled the land, settling in numerous sacred groves. In regional tradition, Panayakkattu Bhagavathy is identified as this child—an embodiment of both Shakti and Annapurneshwari.`]});

D.th[5].b[0]=`മൂന്നു നൂറ്റാണ്ടുമുമ്പ് നീലേശ്വരത്തിനടുത്ത കൊയാമ്പുറം ഗ്രാമത്തിലെ കാലിയാനായ തീയ ചെറുക്കനുമായി ബന്ധപ്പെട്ട കഥയാണ് വിഷ്ണുമൂർത്തിതെയ്യത്തിന്റേത്. കുറുവാട്ട് കുറുപ്പെന്ന പ്രഭു ജന്മിയുടെ കാലികളെ മേയ്ക്കുന്ന പണിയായിരുന്നു കണ്ണന്. കണ്ണനിൽ കുറുപ്പിന്റെ അനന്തരവൾ അനുരക്തയാവുകയും കാര്യമറിഞ്ഞ് വധിക്കാൻ പാഞ്ഞെത്തിയ കയ്യന്മാരിൽ നിന്ന് കണ്ണൻ ഓടി രക്ഷപ്പെടുകയും ചെയ്യുന്നു. വടക്ക് മംഗലാപുരത്ത് കോയിൽപ്പാടി എന്ന തീയത്തറവാട്ടിൽ അഭയം തേടിയ കണ്ണനെ അവിടുത്തെ മുത്തശ്ശി സ്വന്തം മകനെപ്പോലെ സ്വീകരിച്ചു. തറവാട്ടിലെ പരദേവതയായ നരസിംഹമൂർത്തിയുടെ പൂജകനും നിത്യാരാധകനുമായി വർഷം അഞ്ച് പിന്നിട്ടപ്പോൾ പിറന്നനാട്ടുകാണാൻ കണ്ണനു കൊതിയായി. വേഗം മടങ്ങിവരുമെന്നു യാത്ര ചൊല്ലി നടയിറങ്ങിയ ആ യുവാവ് നീലേശ്വരത്തുവന്നെത്തി കദളികുളത്തിൽ കുളിക്കാനിറങ്ങി. കഥയറിഞ്ഞു പാഞ്ഞെത്തിയ കുറുവാട്ടുകുറുപ്പ് കണ്ണന്റെ കഴുത്തറുത്തു. നാടാകെ ദുർനിമിത്തം കണ്ടു.\n\nകുറുപ്പിന്റെ തറവാട് കിടുങ്ങി. പ്രായശ്ചിത്തമായി കോട്ടപ്പുറത്ത് നരസിംഹമൂർത്തി(വിഷ്ണുമൂർത്തി)ക്ക് കുറുപ്പ് കാവൊരുക്കി. കളിയാട്ടം നടത്തി. പാലന്തായി കണ്ണന്റെ തെയ്യക്കോലവും ഈ കാവിൽ കെട്ടിയാടിച്ചു. ഇന്ന് തീയർമാത്രമല്ല സകലസമുദായങ്ങളും ഈ തെയ്യത്തിന്റെ ആരാധകന്മാരാണ്.`;
D.th[5].a[0]=`മംഗലാപുരത്ത് കോയിൽ കുറിപ്പാടിയിൽ നരസിംഹമൂർത്തിക്ക് പൂജാരിയായിരുന്നുവത്രേ കണ്ണൻ. എന്നാൽ നാരായണ ശത്രുവായ ഹിരണ്യന്റെ മകൻ പ്രഹ്ലാദകുമാരന്റെ ഭക്തിപാരവശ്യവും അതൊന്നുകൊണ്ടുതന്നെ മകനെ വധിക്കാനൊരുങ്ങുന്ന പിതൃകോപവും ഈ കഥയിൽ കാണാം. “എവിടെ നിന്റെ നാരായണൻ” എന്ന ഹിരണ്യന്റെ ചോദ്യത്തിന് “സർവ്വ വ്യാപിനായ നാരായണ ഭഗവാൻ ഈ കൊട്ടാരത്തുണിലുമുണ്ട്” എന്നാണുമുത്തരം കൊടുത്തത്. ആ സന്ധ്യാ നേരത്ത് ഉടവാളുകൊണ്ട് തൂണിൽ വെട്ടിയപ്പോൾ അതിന്റെ അകത്തുനിന്ന് സിംഹവും നരനും ഒത്തുചേർന്ന ഭീതിദരൂപം പ്രത്യക്ഷനായി. ഹിരണ്യനെ വാതിൽപ്പടിയിൽ കിടത്തി കൈനഖങ്ങളാൽ വയർ കീറി നരസിംഹം വധിച്ചു. ആ ഭാഗവത കഥാരംഗങ്ങൾ വിഷ്ണുമൂർത്തി തെയ്യം അവതരിപ്പിക്കുന്നത് കമനീയമായ കാഴ്ചകളാണ്.`;

const cdState=()=>{const n=new Date();return n<START?0:n<END?1:2};
const CD={lbl:['ഉത്സവത്തിന് ഇനി','Festival begins in'],units:[['ദിവസം','Days'],['മണിക്കൂർ','Hours'],['മിനിറ്റ്','Min'],['സെക്കൻഡ്','Sec']],
live:['🔥 കളിയാട്ട മഹോത്സവം നടന്നുകൊണ്ടിരിക്കുന്നു','🔥 The Mahotsavam is underway'],done:['കളിയാട്ടം സമാപിച്ചു — ഏവർക്കും നന്ദി','The Mahotsavam has concluded — thank you, devotees']};
function cdInner(st){
  if(st===1)return `<div class="cd msg">${T(CD.live)}</div>`;
  if(st===2)return `<div class="cd msg">${T(CD.done)}</div>`;
  return `<div class="cdl">${T(CD.lbl)}</div><div class="cd">${['d','h','m','s'].map((k,i)=>`<div><b id="cd-${k}">--</b><span>${T(CD.units[i])}</span></div>`).join('')}</div>`;
}
function cdTick(){
  const box=$('#cdbox');if(!box)return;
  const st=cdState();
  if(+box.dataset.s!==st){box.dataset.s=st;box.innerHTML=cdInner(st)}
  if(st!==0)return;
  const s=Math.max(0,Math.floor((START-new Date())/1000));
  const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
  ['d','h','m','s'].forEach((k,i)=>{
    const el=$('#cd-'+k),t=String(v[i]).padStart(2,'0');
    if(el&&el.textContent!==t){
      if(el.textContent!=='--'&&!reduce)el.animate([{transform:'translateY(-8px)',opacity:.2},{transform:'none',opacity:1}],{duration:320,easing:'cubic-bezier(.3,1.4,.5,1)'});
      el.textContent=t;
    }
  });
}
setInterval(cdTick,1000);

      <h2 class="gold" style="font-size:clamp(22px,3.5vw,32px)">${T(D.apH)}</h2>
      <p>${T(D.ap)}</p>
      <div class="cta"><div>${T(D.ctaH)}</div><div class="row"><a href="tel:+919048325291">90 48 32 52 91</a><button class="btn" id="cp">${T(['📋 പകർത്തുക','📋 Copy'])}</button></div></div>
    </div>
  </section>`;
  $('#ft').textContent='© 2026 '+T(D.title)+' · '+T(D.loc);
  bind(instant);
  if(instant){
    scrollTo({top:y,behavior:'instant'});
    const a=$('#app');a.classList.remove('sw');void a.offsetWidth;a.classList.add('sw');
  }
}
function hookImgs(root){
  root.querySelectorAll('img').forEach(im=>{
    const box=im.parentElement,ok=()=>box.classList.add('ld'),bad=()=>box.classList.add('err');
    if(im.complete){im.naturalWidth?ok():bad()}
    else{im.addEventListener('load',ok,{once:true});im.addEventListener('error',bad,{once:true})}
  });
}
function bindTL(){
  $$('#tl .chip').forEach(c=>c.onclick=()=>{lastF=c;tick();openM(+c.dataset.t)});
}
function bind(instant){
  $('#lg').onclick=()=>{tick();S.lang=S.lang==='ml'?'en':'ml';setMenu(false);render(true)};
  $$('.links a').forEach(a=>a.onclick=()=>setMenu(false));
  const tabs=$$('.tab');
  tabs.forEach(b=>{
    b.onclick=()=>{
      if(+b.dataset.d===S.day)return;
      tick();S.day=+b.dataset.d;
      tabs.forEach(t=>{const on=+t.dataset.d===S.day;t.classList.toggle('on',on);t.setAttribute('aria-selected',on)});
      $('#tl').innerHTML=tlHTML();bindTL();
      $$('#tl .rv').forEach(el=>io.observe(el));
    };
    b.onkeydown=e=>{
      if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
      const i=(tabs.indexOf(b)+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
      tabs[i].focus();tabs[i].click();e.preventDefault();
    };
  });
  bindTL();
  $$('.deity').forEach(b=>b.onclick=()=>{lastF=b;tick();openM(+b.dataset.t)});
  $('#cp').onclick=copyNum;
  hookImgs($('#app'));
  mkIO();$$('.rv').forEach(el=>instant?el.classList.add('in'):io.observe(el));
  cdTick();onScroll();
}

/* ---------- modal ---------- */
function lock(){document.body.style.overflow=(document.body.classList.contains('menu')||$('#md').classList.contains('on'))?'hidden':''}
function openM(i,dir=0){
  const x=D.th[i],m=$('#mb'),md=$('#md'),was=md.classList.contains('on'),n=D.th.length,p=(i+n-1)%n,nx=(i+1)%n;
  cur=i;
  const ver=S.lang==='ml'?x.v:x.ve;
  m.innerHTML=`<button class="x" aria-label="Close">×</button><button class="mlg" aria-label="Language">${S.lang==='ml'?'EN':'മല'}</button>
  ${x.img?`<div class="mimg"><img src="${x.img}" alt="${T(x.n)}" decoding="async"></div>`:''}
  <h3 id="mt">${T(x.n)}</h3>${x.ep?`<div class="ep">${T(x.ep)}</div>`:''}
  <p>${x.b?T(x.b):T(D.soon)}</p>${ver?`<div class="verse">${ver}</div>`:''}${x.a?`<p>${T(x.a)}</p>`:''}${x.s?`<div class="src">— ${T(x.s)}</div>`:''}
  ${x.l?`<a class="btn" target="_blank" rel="noopener" href="${x.l[0]}">${T(x.l.slice(1))}</a>`:''}
  <div class="mnav"><button class="pn" data-go="${p}" data-dir="-1">‹ ${T(D.th[p].n)}</button><button class="pn" data-go="${nx}" data-dir="1">${T(D.th[nx].n)} ›</button></div>`;
  m.querySelector('.x').onclick=closeM;
  m.querySelector('.mlg').onclick=()=>{tick();S.lang=S.lang==='ml'?'en':'ml';render(true);openM(cur)};
  m.querySelectorAll('.pn').forEach(b=>b.onclick=()=>{tick();openM(+b.dataset.go,+b.dataset.dir)});
  hookImgs(m);
  m.scrollTop=0;
  md.classList.add('on');md.setAttribute('aria-hidden','false');lock();
  if(was){
    m.focus({preventScroll:true});
    if(dir&&!reduce)m.animate([{opacity:0,translate:`${dir*36}px 0`},{opacity:1,translate:'0 0'}],{duration:340,easing:'cubic-bezier(.2,.7,.2,1)'});
  }else setTimeout(()=>m.querySelector('.x').focus({preventScroll:true}),60);
}
function closeM(){
  const md=$('#md');if(!md.classList.contains('on'))return;
  md.classList.remove('on');md.setAttribute('aria-hidden','true');cur=-1;lock();
  if(lastF&&document.contains(lastF))lastF.focus({preventScroll:true});
}

/* ---------- menu, toast, copy ---------- */
function setMenu(on){document.body.classList.toggle('menu',on);$('#bg').setAttribute('aria-expanded',on);lock()}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
async function copyNum(){
  const n='90 48 32 52 91';
  try{await navigator.clipboard.writeText(n)}catch(e){const t=document.createElement('textarea');t.value=n;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove()}
  tick();toast(T(['നമ്പർ പകർത്തി ✓','Number copied ✓']));
}

/* ---------- global listeners ---------- */
$('#bg').onclick=()=>setMenu(!document.body.classList.contains('menu'));
$('#scrim').onclick=()=>setMenu(false);
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};
$('#up').onclick=()=>{tick();scrollTo({top:0,behavior:'smooth'})};
addEventListener('resize',()=>{if(innerWidth>820)setMenu(false)});
document.addEventListener('keydown',e=>{
  const open=$('#md').classList.contains('on');
  if(e.key==='Escape'){closeM();setMenu(false);return}
  if(!open)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    const n=D.th.length,r=e.key==='ArrowRight';openM((cur+(r?1:n-1))%n,r?1:-1);return;
  }
  if(e.key==='Tab'){
    const f=[...$('#mb').querySelectorAll('button,a[href]')];if(!f.length)return;
    const a=document.activeElement,first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(a===first||a===$('#mb'))){last.focus();e.preventDefault()}
    else if(!e.shiftKey&&a===last){first.focus();e.preventDefault()}
  }
});
let tx=0,ty=0;
$('#mb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#mb').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(cur>-1&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){const n=D.th.length;tick();openM((cur+(dx<0?1:n-1))%n,dx<0?1:-1)}
});
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest&&e.target.closest('.btn,.tab,.chip,.pn,.top');
  if(!b||reduce)return;
  const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,s=document.createElement('span');
  s.className='rip';
  Object.assign(s.style,{width:z+'px',height:z+'px',left:(e.clientX-r.left-z/2)+'px',top:(e.clientY-r.top-z/2)+'px'});
  b.appendChild(s);setTimeout(()=>s.remove(),700);
});
document.addEventListener('pointermove',e=>{
  const c=e.target.closest&&e.target.closest('.card');if(!c)return;
  const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  c.style.setProperty('--x',x+'px');c.style.setProperty('--y',y+'px');
  if(fine&&!reduce&&c.classList.contains('deity')){
    c.style.setProperty('--ry',((x/r.width-.5)*10).toFixed(2)+'deg');
    c.style.setProperty('--rx',((.5-y/r.height)*10).toFixed(2)+'deg');
  }
});
document.addEventListener('pointerout',e=>{
  const c=e.target.closest&&e.target.closest('.deity');
  if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}
});
let tk=false;
function onScroll(){
  if(tk)return;tk=true;
  requestAnimationFrame(()=>{
    tk=false;
    const y=scrollY,h=document.documentElement.scrollHeight-innerHeight,p=h>0?Math.min(1,y/h):0;
    $('#bar').style.transform=`scaleX(${p})`;
    $('nav').classList.toggle('sc',y>20);
    const up=$('#up');up.classList.toggle('on',y>600);up.style.setProperty('--p',(p*100).toFixed(1));
    let c='#top';
    D.nav.forEach(n=>{const el=document.querySelector(n[2]);if(el&&el.getBoundingClientRect().top<140)c=n[2]});
    $$('.links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===c));
  });
}
addEventListener('scroll',onScroll,{passive:true});

/* ---------- rising embers ---------- */
(function(){
  const cv=$('#embers');if(!cv||reduce)return;
  const ctx=cv.getContext('2d');let W,H,ps=[],raf=0;
  const mk=init=>({x:Math.random()*W,y:init?Math.random()*H:H+10,r:Math.random()*1.8+.6,v:Math.random()*.5+.25,a:Math.random()*6.28,s:Math.random()*.02+.005,o:Math.random()*.5+.3});
  function size(){
    const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    const n=Math.min(55,Math.floor(W/22));while(ps.length<n)ps.push(mk(true));ps.length=n;
  }
  function frame(){
    raf=0;ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    for(const p of ps){
      p.y-=p.v;p.a+=p.s;p.x+=Math.sin(p.a)*.35;
      if(p.y<-10){Object.assign(p,mk(false))}
      const al=p.o*Math.max(0,Math.min(1,p.y/(H*.4)));
      ctx.fillStyle=`rgba(255,${150+Math.floor(p.o*90)},40,${al*.18})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,6.283);ctx.fill();
      ctx.fillStyle=`rgba(255,${170+Math.floor(p.o*80)},60,${al})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
    }
    if(document.visibilityState==='visible')raf=requestAnimationFrame(frame);
  }
  size();addEventListener('resize',size);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!raf)raf=requestAnimationFrame(frame)});
  raf=requestAnimationFrame(frame);
})();

render();
</script>
